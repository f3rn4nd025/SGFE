<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editar Fotógrafo | SGFE WEB</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
body{font-family:Arial,sans-serif}.fp{max-width:760px;margin:30px auto;padding:0 24px}.fp h1{margin:0}.fp .sub{color:#819596;margin:8px 0 22px}.card{background:#071011;border:1px solid #123f41;border-radius:14px;padding:26px}.field{margin-bottom:16px}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:7px;color:#b8c9ca}.field input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;background:#050809;border:1px solid #285255;color:#fff}.btn{border:1px solid #27d873;background:#159451;color:#fff;border-radius:9px;padding:11px 16px;font-weight:900;font-size:12px;cursor:pointer;text-decoration:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.back{border-color:#285255;background:#0a2729}.err{padding:12px;border-radius:8px;background:#351619;border:1px solid #8e3138;margin-bottom:15px;color:#ffb4b7}.hint{color:#819596;font-size:12px;margin-top:5px}
</style>
</head>
<body><div class="fp">
<div class="page-actions"><a class="nav-btn" href="{{ url_for('web_fotografos') }}">← VOLTAR</a></div>
<h1>Editar fotógrafo</h1><div class="sub">Altere os dados de acesso do fotógrafo.</div>
{% if erro %}<div class="err">{{ erro }}</div>{% endif %}
<div class="card">
<form method="post" autocomplete="off">
<div class="field"><label>NOME</label><input name="nome" value="{{ fotografo.nome }}" required></div>
<div class="field"><label>CELULAR</label><input name="celular" value="{{ fotografo.celular }}" required></div>
<div class="field"><label>LOGIN</label><input name="login" value="{{ fotografo.login }}" autocomplete="off" required></div>
<div class="field"><label>NOVA SENHA</label><input name="senha" type="password" autocomplete="new-password"><div class="hint">Deixe em branco para manter a senha atual.</div></div>
<div class="actions"><button class="btn" type="submit">💾 SALVAR ALTERAÇÕES</button><a class="btn back" href="{{ url_for('web_fotografos') }}">CANCELAR</a></div>
</form></div></div></body></html>
