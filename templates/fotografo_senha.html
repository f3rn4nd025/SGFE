<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alterar senha | SGFE WEB</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
.fs{max-width:440px;margin:60px auto;padding:0 24px}
.fs .page-actions{margin-bottom:22px}
.fs-eyebrow{font-size:11px;font-weight:900;letter-spacing:1.5px;color:#12d8de;margin-bottom:8px}
.fs h1{margin:0;font-size:28px;color:#fff}
.fs .sub{color:#819596;margin:10px 0 26px;font-size:14px;line-height:1.5}

.card{background:linear-gradient(150deg,#081415,#050b0c);border:1px solid #123f41;border-radius:16px;padding:26px;box-shadow:0 10px 34px rgba(0,0,0,.32)}

.field{margin-bottom:16px}
.field label{display:block;font-size:10.5px;font-weight:900;letter-spacing:.6px;margin-bottom:7px;color:#96abac}
.field input{width:100%;box-sizing:border-box;padding:12px 13px;border-radius:9px;background:#050b0c;border:1px solid #1c4548;color:#eefafa;font-size:13.5px;transition:border-color .15s,box-shadow .15s}
.field input::placeholder{color:#4c6567}
.field input:focus{outline:none;border-color:#12d8de;box-shadow:0 0 0 3px rgba(18,216,222,.14)}
.field .hint{margin:6px 0 0;font-size:11px;color:#5e7879}

.btn{border:1px solid #27d873;background:#159451;color:#fff;border-radius:9px;padding:11px 16px;font-weight:900;font-size:12px;cursor:pointer;letter-spacing:.3px;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.98)}
.btn-submit{width:100%;padding:13px 16px;margin-top:4px;background:linear-gradient(135deg,#1cb868,#0e7a44);border-color:#27d873}

.msg{padding:13px 15px;border-radius:10px;background:#0b3029;border:1px solid #1a8c61;color:#a9ffe0;margin-bottom:18px;font-size:13px}
.err{padding:13px 15px;border-radius:10px;background:#351619;border:1px solid #8e3138;color:#ffb4b7;margin-bottom:18px;font-size:13px}
</style>
</head><body>
<div class="fs">
  <div class="page-actions"><a class="nav-btn" href="/">← PAINEL</a></div>

  <div class="fs-eyebrow">MEU PERFIL</div>
  <h1>Alterar senha</h1>
  <p class="sub">Troque sua senha de acesso ao SGFE. Você vai precisar informar a senha atual.</p>

  {% if mensagem %}<div class="msg">{{ mensagem }}</div>{% endif %}
  {% if erro %}<div class="err">{{ erro }}</div>{% endif %}

  <div class="card">
    <form method="post">
      <div class="field"><label>SENHA ATUAL</label><input name="senha_atual" type="password" placeholder="••••••••" required autocomplete="current-password"></div>
      <div class="field">
        <label>NOVA SENHA</label>
        <input name="nova_senha" type="password" placeholder="••••••••" required autocomplete="new-password" minlength="4">
        <p class="hint">Mínimo de 4 caracteres.</p>
      </div>
      <div class="field"><label>CONFIRMAR NOVA SENHA</label><input name="confirmar_senha" type="password" placeholder="••••••••" required autocomplete="new-password" minlength="4"></div>
      <button class="btn btn-submit" type="submit">SALVAR NOVA SENHA</button>
    </form>
  </div>
</div>
</body></html>
