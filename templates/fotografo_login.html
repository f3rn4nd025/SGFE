<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login do Fotógrafo | SGFE WEB</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050809;color:#fff;font-family:Arial}.card{width:min(390px,calc(100vw - 40px));background:#071011;border:1px solid #123f41;border-radius:14px;padding:28px;box-sizing:border-box}h1{text-align:center;font-size:21px}.field{margin:15px 0}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:11px;border-radius:8px;background:#050809;border:1px solid #285255;color:#fff}button{width:100%;padding:12px;border-radius:8px;border:1px solid #27d873;background:#159451;color:#fff;font-weight:900}.err{text-align:center;color:#ff8f95;margin-top:15px;font-size:12px}</style></head><body><div class="card"><h1>PAINEL DO FOTÓGRAFO</h1><form method="post"><div class="field"><label>LOGIN</label><input name="login" required autocomplete="username"></div><div class="field"><label>SENHA</label><input name="senha" type="password" required autocomplete="current-password"></div><button type="submit">ENTRAR</button></form>{% if erro %}<div class="err">{{ erro }}</div>{% endif %}</div></body></html>
