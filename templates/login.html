<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | SGFE WEB</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
body{min-height:100vh;display:grid;place-items:center;background:#050809}
.login{width:min(510px,calc(100vw - 36px));background:#071011;border:1px solid #123f41;border-radius:16px;padding:34px;box-shadow:0 18px 55px #0009;box-sizing:border-box}
.brand{display:flex;align-items:center;justify-content:center;gap:42px;margin-bottom:28px}.brand h1{margin:0;color:#fff;font-size:34px;line-height:1.15}.brand p{max-width:255px;margin:0;color:#819596;font-size:18px;line-height:1.35;text-align:center}
.field{margin:17px 0}.field label{display:block;color:#b8c9ca;font-size:12px;font-weight:900;margin-bottom:8px}.input-wrap{position:relative}.field input{width:100%;box-sizing:border-box;padding:14px;border-radius:9px;background:#050809;border:1px solid #285255;color:#fff;font-size:16px}.input-wrap input{padding-right:54px}
.eye{position:absolute;right:5px;top:5px;width:44px;height:42px;border:0;border-radius:7px;background:transparent;color:#9fb2b3;cursor:pointer;font-size:20px}.eye:hover{background:#0c2426;color:#fff}
.remember{display:flex;align-items:center;gap:9px;margin:13px 0 20px;color:#9fb2b3;font-size:14px;cursor:pointer}.remember input{width:17px;height:17px;accent-color:#159451;cursor:pointer}
.btn{width:100%;padding:14px;border-radius:9px;border:1px solid #27d873;background:#159451;color:#fff;font-size:16px;font-weight:900;cursor:pointer}.btn:hover{filter:brightness(1.06)}
.err{margin-bottom:14px;padding:12px;border-radius:9px;background:#351619;border:1px solid #8e3138;color:#ffb4b7}
@media(max-width:520px){.brand{gap:20px}.brand h1{font-size:30px}.brand p{font-size:15px}}
</style>
</head>
<body>
<main class="login">
  <div class="brand"><h1>SGFE<br>WEB</h1><p>SISTEMA DE GESTÃO FG FOTOS ESPORTIVAS</p></div>
  {% if erro %}<div class="err">{{ erro }}</div>{% endif %}
  <form method="post" autocomplete="off">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field"><label>LOGIN</label><input id="login" name="login" autocomplete="off" required autofocus></div>
    <div class="field"><label>SENHA</label><div class="input-wrap"><input id="senha" name="senha" type="password" autocomplete="new-password" required><button class="eye" id="toggleSenha" type="button" aria-label="Visualizar senha" title="Visualizar senha">◉</button></div></div>
    <label class="remember"><input id="lembrar" name="lembrar" value="1" type="checkbox"> Gravar acesso e entrar automaticamente</label>
    <button class="btn" type="submit">ENTRAR</button>
  </form>
</main>
<script>
(function(){
  var login=document.getElementById('login');
  var senha=document.getElementById('senha');
  var toggle=document.getElementById('toggleSenha');

  function limparCampos(){
    login.value='';
    senha.value='';
    login.focus();
  }

  toggle.addEventListener('click',function(){
    var vis=senha.type==='text';
    senha.type=vis?'password':'text';
    toggle.setAttribute('aria-label',vis?'Visualizar senha':'Ocultar senha');
    toggle.setAttribute('title',vis?'Visualizar senha':'Ocultar senha');
  });

  window.addEventListener('pageshow', function(){
    setTimeout(limparCampos, 80);
  });
  setTimeout(limparCampos, 80);
})();
</script>
</body>
</html>
